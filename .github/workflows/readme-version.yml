# Keeps the version on the readme's download links (V1.0.0) in step with the latest release.
# Runs when a release is published, or by hand from the Actions tab.
name: Readme version

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Put the latest version on the download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest release, not necessarily the one that triggered this: a pre-release isn't the latest.
          tag=$(gh release view --json tagName --jq .tagName)
          version="V${tag#[vV]}"
          sed -i -E "s#(releases/latest/download/[^\"]+\">)[^<]*</a>#\1${version}</a>#g" readme.md
          if git diff --quiet; then
            echo "The readme already shows $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Show $version on the readme's download links"
          git push
